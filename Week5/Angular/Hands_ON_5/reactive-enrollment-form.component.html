<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="submit()">

    <label>Student Name</label><br>

    <input
        type="text"
        formControlName="studentName">

    <div *ngIf="enrollForm.get('studentName')?.touched &&
                enrollForm.get('studentName')?.invalid">

        Name should contain minimum 3 characters

    </div>

    <br><br>

    <label>Email</label><br>

    <input
        type="email"
        formControlName="studentEmail">

    <div *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">

        Email already exists

    </div>

    <br><br>

    <label>Course ID</label><br>

    <input
        type="text"
        formControlName="courseId">

    <div *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">

        Course code starting with XX is not allowed.

    </div>

    <br><br>

    <label>Semester</label>

    <select formControlName="preferredSemester">

        <option>Odd</option>

        <option>Even</option>

    </select>

    <br><br>

    <label>

        <input
            type="checkbox"
            formControlName="agreeToTerms">

        Agree Terms

    </label>

    <br><br>

    <h3>Additional Courses</h3>

    <button
        type="button"
        (click)="addCourse()">

        Add Another Course

    </button>

    <br><br>

    <div
        *ngFor="let ctrl of additionalCourses.controls; let i=index">

        <input [formControl]="ctrl">

        <button
            type="button"
            (click)="removeCourse(i)">

            Remove

        </button>

    </div>

    <br>

    <button
        type="submit"
        [disabled]="enrollForm.invalid">

        Submit

    </button>

</form>
