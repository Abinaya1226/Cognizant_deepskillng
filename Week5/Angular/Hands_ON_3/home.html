<h1>{{ portalName }}</h1>

<p>Welcome to the Student Course Portal.</p>

<button
[disabled]="!isPortalActive"
(click)="onEnrollClick()">

Enroll Now

</button>

<p>{{ message }}</p>

<input
type="text"
[(ngModel)]="searchTerm"
placeholder="Search courses">

<p>Searching for: {{ searchTerm }}</p>

<!--
[property]
One-way binding
Component → HTML

[(ngModel)]
Two-way binding
Component ↔ HTML
-->
